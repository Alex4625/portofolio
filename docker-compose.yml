version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: portofolio-app
    restart: unless-stopped
    env_file: .env
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    networks:
      - portofolio-network

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - portofolio-network

networks:
  portofolio-network:
    driver: bridge
